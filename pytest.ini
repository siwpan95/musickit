[pytest]
# 放在仓库根，而不是 remix/ 下。
#
# 原来配置在 remix/pytest.ini：从 remix/ 里跑 `pytest tests` 一切正常，
# 但文档和 scripts/ci_smoke.sh 现在都是从仓库根跑（`pytest remix/tests music/tests`），
# 那时 rootdir 取不到这份 ini —— 于是 `smoke` 标记变成未注册（每个文件刷一条
# PytestUnknownMarkWarning），testpaths 也不生效。两处配置并存更难说清谁生效，故只留这一份。
#
# 用法（根目录）：
#   pytest                          # 跑两侧全量
#   pytest -m smoke                 # 纯逻辑快速档，秒级
#   pytest remix/tests -q           # 只跑引擎侧

testpaths = remix/tests music/tests radio/tests

markers =
    smoke: 快速冒烟测试（纯逻辑，无 ffmpeg 编解码依赖；pytest -m smoke 秒级跑完）
